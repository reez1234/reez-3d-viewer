
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REEZ | 3D Character</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <model-viewer
    src="./karakter_reez_recover2-compressed.glb"
    alt="REEZ 3D character"
    camera-controls
    auto-rotate
    rotation-per-second="20deg"
    shadow-intensity="1"
    exposure="1"
    interaction-prompt="none"
    loading="eager">
  </model-viewer>

</body>
</html>
